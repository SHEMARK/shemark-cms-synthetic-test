backend:
  name: github
  repo: SHEMARK/shemark-cms-synthetic-test
  branch: main
  base_url: https://shemark-cms-synthetic-test.pages.dev
  auth_endpoint: api/auth

media_folder: "public/assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "artworks"
    label: "Artworks / 艺术画作"
    folder: "src/data/artworks"
    create: true
    slug: "{{id}}"
    format: "json"
    fields:
      - { label: "Artwork ID", name: "id", widget: "string", default: "TEST-001" }
      - { label: "Title (EN)", name: "titleEn", widget: "string" }
      - { label: "Title (CN)", name: "titleZh", widget: "string" }
      - { label: "Cover Image", name: "coverImage", widget: "image" }
      - { label: "Description (EN)", name: "descriptionEn", widget: "text" }
      - { label: "Description (CN)", name: "descriptionZh", widget: "text" }
      - { label: "Status", name: "status", widget: "select", options: ["draft", "published", "archived"], default: "draft" }
