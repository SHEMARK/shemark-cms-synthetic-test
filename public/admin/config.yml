backend:
  name: github
  repo: SHEMARK/shemark-cms-synthetic-test
  branch: main
  base_url: https://shemark-cms-synthetic-test.shiny-cloud-affd.workers.dev
  auth_endpoint: api/auth

media_folder: "public/assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  # 1. Original Artworks & Gallery (原作画作与画廊) -> /artworks
  - name: "artworks"
    label: "Original Artworks & Advisory / 唯一原作画廊与私洽"
    folder: "src/data/artworks"
    create: true
    slug: "{{id}}"
    format: "json"
    fields:
      - { label: "Artwork ID / 作品编号", name: "id", widget: "string", default: "AW-001" }
      - { label: "Title (EN) / 英文标题", name: "titleEn", widget: "string" }
      - { label: "Title (CN) / 中文标题", name: "titleZh", widget: "string" }
      - { label: "Cover Image / 封面图片", name: "coverImage", widget: "image", required: false }
      - { label: "Medium / 材质媒介 (如: 综合矿物矿物颜料画布)", name: "medium", widget: "string", required: false }
      - { label: "Dimensions / 尺寸规格", name: "dimensions", widget: "string", required: false }
      - { label: "Curator Note (EN) / 策展导览(英)", name: "curatorNoteEn", widget: "text", required: false }
      - { label: "Curator Note (CN) / 策展导览(中)", name: "curatorNoteZh", widget: "text", required: false }
      - { label: "Status / 状态", name: "status", widget: "select", options: ["draft", "published", "archived"], default: "published" }

  # 2. Digital Art Editions (数字艺术与壁纸) -> /digital-artworks, /free-art
  - name: "digital_art"
    label: "Digital Art Editions & Wallpapers / 数字艺术与壁纸"
    folder: "src/data/digital-art"
    create: true
    slug: "{{id}}"
    format: "json"
    fields:
      - { label: "Digital ID / 数字艺术编号", name: "id", widget: "string", default: "DIG-001" }
      - { label: "Product Type / 产品类型", name: "category", widget: "select", options: [
          "01 · Printable Fine Art / 微喷艺术版画",
          "02 · Digital Wallpapers (Mobile/Desktop) / 数字壁纸",
          "02 · Samsung The Frame / 画壁电视专属预览",
          "03 · Digital Gift Cards / 艺术数字礼品卡 (预留)",
          "Free Art Wallpapers / 免费艺术壁纸"
        ], default: "02 · Digital Wallpapers (Mobile/Desktop) / 数字壁纸" }
      - { label: "Title (EN) / 英文标题", name: "titleEn", widget: "string" }
      - { label: "Title (CN) / 中文标题", name: "titleZh", widget: "string" }
      - { label: "Device Compatibility / 适配设备与规格", name: "deviceCompatibility", widget: "string", default: "iPhone / Android (9:16) & 4K Desktop" }
      - { label: "Access Tier / 交付属性", name: "accessTier", widget: "select", options: [
          "Free Download / 免费直接下载",
          "Preview Only / 仅供高清预览",
          "Custom Inquiry / 专属咨询定制"
        ], default: "Free Download / 免费直接下载" }
      - { label: "Preview Image / 预览展示图", name: "previewImage", widget: "image", required: false }
      - { label: "Download File / 免费壁纸下载原图", name: "downloadFile", widget: "file", required: false }
      - { label: "Licensing Note / 授权说明", name: "licensingNote", widget: "text", required: false, default: "Free for personal non-commercial wallpaper display." }
      - { label: "Status / 状态", name: "status", widget: "select", options: ["draft", "published", "archived"], default: "published" }

  # 3. Artful Objects (实体好物) -> /shop/artful-objects
  - name: "objects"
    label: "Artful Objects / 实体好物"
    folder: "src/data/objects"
    create: true
    slug: "{{id}}"
    format: "json"
    fields:
      - { label: "Object ID / 好物编号", name: "id", widget: "string", default: "OBJ-001" }
      - { label: "Name (EN) / 英文名称", name: "nameEn", widget: "string" }
      - { label: "Name (CN) / 中文名称", name: "nameZh", widget: "string" }
      - { label: "Related Artwork ID / 关联原作编号", name: "relatedArtworkId", widget: "string", required: false }
      - { label: "Cover Image / 产品展示图", name: "coverImage", widget: "image", required: false }
      - { label: "Material & Craft / 材质与工艺说明", name: "materialCraft", widget: "text", required: false }
      - { label: "Inquiry Guide / 定制与打样说明", name: "inquiryGuide", widget: "text", required: false, default: "In development · Early curatorial inquiries welcome" }
      - { label: "Status / 状态", name: "status", widget: "select", options: ["draft", "published", "archived"], default: "published" }

  # 4. Art in Your Space (空间美学与案例) -> /art-in-your-space
  - name: "spaces"
    label: "Art in Your Space / 空间美学与案例"
    folder: "src/data/spaces"
    create: true
    slug: "{{id}}"
    format: "json"
    fields:
      - { label: "Space ID / 空间案例编号", name: "id", widget: "string", default: "SPC-001" }
      - { label: "Space Name (EN) / 英文名称", name: "spaceNameEn", widget: "string" }
      - { label: "Space Name (CN) / 中文名称", name: "spaceNameZh", widget: "string" }
      - { label: "Space Category / 空间类型", name: "spaceType", widget: "select", options: [
          "Boutique Hotel / 精品酒店套房",
          "Private Residence / 高端私宅定制",
          "Tea Pavilion / 禅意茶庭空间",
          "Commercial Studio / 商业设计空间"
        ], default: "Boutique Hotel / 精品酒店套房" }
      - { label: "Cover Image / 实景照片", name: "coverImage", widget: "image", required: false }
      - { label: "Featured Artwork IDs / 包含画作编号", name: "featuredArtworkIds", widget: "string", required: false }
      - { label: "Case Story (EN) / 空间营造故事(英)", name: "caseStoryEn", widget: "text", required: false }
      - { label: "Case Story (CN) / 空间营造故事(中)", name: "caseStoryZh", widget: "text", required: false }
      - { label: "Status / 状态", name: "status", widget: "select", options: ["draft", "published", "archived"], default: "published" }

  # 5. Living Collections (策展主题合集) -> /collections
  - name: "collections"
    label: "Living Collections / 策展主题合集"
    folder: "src/data/collections"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { label: "Collection Slug / 唯一路径", name: "slug", widget: "select", options: [
          "color-your-everyday",
          "artful-spaces",
          "little-gifts-of-art"
        ], default: "color-your-everyday" }
      - { label: "Theme Title (EN) / 英文主题", name: "themeTitleEn", widget: "string" }
      - { label: "Theme Title (CN) / 中文主题", name: "themeTitleZh", widget: "string" }
      - { label: "Curatorial Statement / 策展阐述", name: "curatorialStatement", widget: "text", required: false }
      - { label: "Banner Image / 主题横幅图", name: "bannerImage", widget: "image", required: false }
      - { label: "Status / 状态", name: "status", widget: "select", options: ["draft", "published", "archived"], default: "published" }

  # 6. Our Story & Global Content (全站文案与品牌故事) -> /the-artist, Header, Footer
  - name: "site_content"
    label: "Our Story & Global Content / 品牌故事与全站文案"
    files:
      - label: "Global Brand & Artist Settings / 品牌与艺术家全局设置"
        name: "global_settings"
        file: "src/data/site-content.json"
        fields:
          - { label: "Tagline / 导航标语", name: "tagline", widget: "string", default: "ART · SPACE · LIFE" }
          - { label: "Hero Headline (EN) / 首页主标题(英)", name: "heroHeadlineEn", widget: "string", default: "Live With Art." }
          - { label: "Hero Headline (CN) / 首页主标题(中)", name: "heroHeadlineZh", widget: "string", default: "生活 · 艺术 · 疗愈" }
          - { label: "Hero Subhead (EN) / 首页副标题(英)", name: "heroSubheadEn", widget: "string", default: "Original art for the things you wear, use, and live with." }
          - { label: "Hero Subhead (CN) / 首页副标题(中)", name: "heroSubheadZh", widget: "string", default: "以天然矿物色彩与流动画意，将松哥原作融于日常器物、数字艺术与空间体验。" }
          - { label: "The Artist Songge Bio (EN) / 艺术家松哥介绍(英)", name: "artistBioEn", widget: "text", default: "Authentic oil and natural mineral masterworks created in Hangzhou mountain studio." }
          - { label: "The Artist Songge Bio (CN) / 艺术家松哥介绍(中)", name: "artistBioZh", widget: "text", default: "隐居杭州山间的当代艺术家松哥，以天然矿物颜料与细腻笔触探索空间疗愈。" }
          - { label: "Contact Email / 业务咨询邮箱", name: "contactEmail", widget: "string", default: "packaging@bdsupply.cc" }
          - { label: "Footer Copyright / 页脚版权信息", name: "footerCopyright", widget: "string", default: "© 2026 SHEMARK LIVING. All rights reserved." }
